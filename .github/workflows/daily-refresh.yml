name: Daily market data refresh

on:
  schedule:
    # 22:30 UTC, Monday to Friday: after the US close (16:00 ET) in both summer and winter time.
    - cron: "30 22 * * 1-5"
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    # Same Python as the backend image; the job talks to Neon directly (no Render time limit).
    container: python:3.15-slim
    timeout-minutes: 60
    defaults:
      run:
        working-directory: back
    env:
      POETRY_VIRTUALENVS_CREATE: "false"
      POETRY_NO_INTERACTION: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          pip install --no-cache-dir --root-user-action=ignore poetry
          poetry install --no-root

      - name: US snapshot, opened instruments, FX rates
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
        run: python -m app.jobs daily
