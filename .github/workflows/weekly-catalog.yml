name: Weekly US catalog refresh

on:
  schedule:
    # Sunday 06:00 UTC: refreshes the ~11k US stocks/ETFs used by search and market movers.
    - cron: "0 6 * * 0"
  workflow_dispatch:

jobs:
  catalog:
    runs-on: ubuntu-latest
    container: python:3.15-slim
    timeout-minutes: 30
    defaults:
      run:
        working-directory: back
    env:
      POETRY_VIRTUALENVS_CREATE: "false"
      POETRY_NO_INTERACTION: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          pip install --no-cache-dir --root-user-action=ignore poetry
          poetry install --no-root

      - name: US catalog (about 13 Massive calls at 5/minute)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
        run: python -m app.jobs catalog
