[project]
name = "tradehelper-back"
version = "0.1.0"
description = "TradeHelper API (FastAPI)"
requires-python = ">=3.15,<3.16"
dependencies = [
    "fastapi (>=0.115)",
    "uvicorn[standard] (>=0.32)",
    "pydantic-settings (>=2.6)",
    "sqlalchemy (>=2.0)",
    "alembic (>=1.14)",
    "psycopg[binary] (>=3.2)",
    "httpx (>=0.28)",
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
